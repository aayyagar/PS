name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows - ${{ matrix.shell == 'powershell' && 'Windows PowerShell 5.1' || 'PowerShell 7' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        run: |
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if (@($r | Where-Object Severity -eq 'Error').Count) { throw 'PSScriptAnalyzer found errors' }
      - name: Tests (includes building the GUI window)
        run: |
          Import-Module Pester -MinimumVersion 5.5
          Invoke-Pester ./tests -CI -Output Detailed

  linux:
    name: Linux - PowerShell 7 (module and logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester ./tests -CI -Output Detailed
